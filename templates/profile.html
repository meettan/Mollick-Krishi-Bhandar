<!doctype html><html><head><meta charset="utf-8"><title>My Profile - BENFED</title><link rel="stylesheet" href="/static/sidebar_common.css"><link rel="stylesheet" href="/static/user_pages.css"></head><body><div class="user-page">{% include 'sidebar.html' %}<main class="user-main"><div class="user-card"><h1 class="user-title">My Profile</h1><div class="user-sub">View your account details and change your password.</div>{% if error %}<div class="user-alert">{{ error }}</div>{% endif %}{% if success %}<div class="user-success">{{ success }}</div>{% endif %}{% if user %}<div class="user-meta"><div><strong>Username</strong></div><div>{{ user.username }}</div><div><strong>User Type</strong></div><div>{{ user.user_type }}</div></div><form method="post" action="/profile"><div class="user-field"><label>New Password</label><input type="password" name="password" required maxlength="255"></div><button class="user-btn" type="submit">Update Password</button></form>{% endif %}</div></main></div><script>if(window.lucide)lucide.createIcons();</script></body></html>
